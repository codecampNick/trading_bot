[tool.poetry]
name = "trading-bot"
version = "0.1.0"
description = "Multi-silo trading bot"
authors = ["NickRoss <nick.jp.ros@gmail.com>"]
readme = "README.md"

[[tool.poetry.packages]]
include = "trading_bot"
from = "src"

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^2.2"
numpy = "^2.1"
requests = "^2.32"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^24.8"
ruff = "^0.9"
pytest-cov = "^7.1.0"
pandas = ">=2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"