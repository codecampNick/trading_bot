[project]
name = "trading-bot"
version = "0.1.0"
description = "Multi-silo trading bot"
authors = [{ name = "NickRoss", email = "nick.jp.ros@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas >=2.2",
    "numpy >=2.1",
    "requests >=2.32",
    "python-dotenv >=1.0"
]

[project.scripts]
runbot = "trading_bot.main:run"

[[tool.poetry.packages]]
include = "trading_bot"
from = "src"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^24.8"
ruff = "^0.9"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"